name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check Supabase configuration
        # public by design (RLS protects the data); set under
        # Settings → Secrets and variables → Actions → Variables. Never a secret / service_role key.
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          if [ -z "$VITE_SUPABASE_URL" ] || [ -z "$VITE_SUPABASE_PUBLISHABLE_KEY" ]; then
            echo "::warning::Supabase variables not set - deploying without analytics (the game still works)."
            exit 0
          fi
          case "$VITE_SUPABASE_URL" in https://*.supabase.co) ;; *) echo "::error::VITE_SUPABASE_URL must look like https://<ref>.supabase.co"; exit 1 ;; esac
          case "$VITE_SUPABASE_PUBLISHABLE_KEY" in
            sb_secret_*) echo "::error::That is a SECRET key. Use the publishable key (sb_publishable_...)."; exit 1 ;;
            sb_publishable_*) echo "Publishable key: OK" ;;
            eyJ*) # legacy JWT key: make sure it is the anon key, never service_role
              role=$(echo "$VITE_SUPABASE_PUBLISHABLE_KEY" | cut -d. -f2 | tr '_-' '/+' | base64 -d 2>/dev/null | grep -o '"role":"[a-z_]*"' || true)
              if [ "$role" != '"role":"anon"' ]; then echo "::error::Legacy key is not the anon key ($role). Use the publishable key."; exit 1; fi
              echo "Legacy anon key: OK" ;;
            *) echo "::error::Unrecognised key format"; exit 1 ;;
          esac
          echo "Supabase configured for ${VITE_SUPABASE_URL}"
      - run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
      - name: Verify build output
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
        run: |
          test -f dist/index.html && test -f dist/admin.html
          echo "index.html + admin.html: OK"
          if [ -n "$VITE_SUPABASE_URL" ]; then
            grep -rlq "$VITE_SUPABASE_URL" dist/assets && echo "Supabase URL baked into the build: OK" \
              || { echo "::error::Supabase URL missing from the build"; exit 1; }
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
